<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Confident Creator</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234E592B'/><circle cx='50' cy='50' r='22' fill='none' stroke='%23F6F7F0' stroke-width='7'/><circle cx='50' cy='50' r='9' fill='%23F6F7F0'/></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>
    <main class="admin-login-page">
        <div class="admin-login-card animate-slideUp">
            <!-- Header -->
            <div class="admin-login-header">
                <div class="lock-icon" aria-hidden="true">🔒</div>
                <h1>Admin Panel</h1>
                <p>Confident Creator Configuration</p>
            </div>

            <!-- Error/Success Alerts -->
            <div id="login-error" class="alert alert-error hidden" role="alert" aria-live="polite"></div>

            <!-- Login Form -->
            <form id="admin-login-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="admin@confidentcreator.app"
                        required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-input-wrap">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required
                            autocomplete="current-password">
                        <button type="button" id="toggle-password-btn" class="password-toggle-btn"
                            aria-label="Show password" title="Show password">👁️</button>
                    </div>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary btn-full btn-lg">
                    <span class="btn-text">Sign In as Admin</span>
                    <span class="btn-loader loading-spinner hidden"></span>
                </button>
            </form>

            <div class="admin-login-footer">
                <a href="../index.html" class="admin-back-link">
                    &larr; Back to main site
                </a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/admin-auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            initSupabase();
            adminAuth.init();

            // Attach UI handlers immediately BEFORE awaiting session checks
            // so early submits can never trigger a default GET page reload
            const togglePasswordBtn = document.getElementById('toggle-password-btn');
            const passwordInput = document.getElementById('password');
            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', () => {
                    const isHidden = passwordInput.type === 'password';
                    passwordInput.type = isHidden ? 'text' : 'password';
                    togglePasswordBtn.textContent = isHidden ? '🙈' : '👁️';
                    togglePasswordBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
                    togglePasswordBtn.title = isHidden ? 'Hide password' : 'Show password';
                });
            }

            // Show error from redirect if present
            const params = new URLSearchParams(window.location.search);
            if (params.get('error') === 'not_admin') {
                showError('This account does not have admin access.');
            }

            // Handle form submit
            document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const btn = document.getElementById('login-btn');
                const btnText = btn.querySelector('.btn-text');
                const btnLoader = btn.querySelector('.btn-loader');

                btn.disabled = true;
                btnText.textContent = 'Verifying...';
                btnLoader.classList.remove('hidden');

                const result = await adminAuth.signIn(email, password);

                if (result.success) {
                    btnText.textContent = 'Redirecting...';
                    window.location.href = 'index.html';
                } else {
                    showError(result.error);
                    btn.disabled = false;
                    btnText.textContent = 'Sign In as Admin';
                    btnLoader.classList.add('hidden');
                }
            });

            // Check if already admin — redirect to dashboard
            await adminAuth.redirectIfAdmin();
        });

        function showError(msg) {
            const el = document.getElementById('login-error');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('login-error').classList.add('hidden');
        }
    </script>
</body>

</html>
